services:
  trendradar:
    build:
      context: ..
      dockerfile: Dockerfile
    image: trendradar:local
    working_dir: /app
    volumes:
      - ./runtime/config.json:/config/config.json:ro
      - ./runtime/data:/data
    entrypoint:
      - trendradar
      - --config
      - /config/config.json
      - --db
      - /data/trendradar.db
    command:
      - --output
      - json
    restart: "no"
